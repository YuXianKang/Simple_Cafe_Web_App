{% extends "base.html" %}

<link rel="stylesheet" href="{{ url_for('static', filename='css/user/update_account.css') }}">

{% block content %}
<h2>Update Account</h2>
<form action="{{ url_for('update_account') }}" method="post">
    <label for="username">Username:</label>
    <input type="text" id="username" name="username" value="{{ user.username }}" required>

    <label for="firstn">First Name:</label>
    <input type="text" id="firstn" name="firstn" value="{{ user.firstn }}" required>

    <label for="lastn">Last Name:</label>
    <input type="text" id="lastn" name="lastn" value="{{ user.lastn }}" required>

    <label for="mobile">Mobile Number:</label>
    <input type="number" id="mobile" name="mobile" value="{{ user.mobile }}" required>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" value="{{ user.email }}" required>

    <label for="password">Password:</label>
    <input type="password" id="password" name="password" value="{{ user.password }}" required>

    <button type="submit">Submit</button>
</form>
{% endblock %}
